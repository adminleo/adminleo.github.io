      excerpt: "18km through mud, walls, and ice water — XLETIX was brutal. But building a deep-tech startup is the same race. We solved a critical ML architecture challenge in cNode, completely rebuilt our proof-of-concept to show substance over marketing, and relocated R&D to Linz. We don't run for headlines — we run for a vision."
      date: "Jul 2025"
