      - Full-Text Search
      - HubSpot Analytics
    url: https://ai-playbook.eu

  - name: "Gasvisor — IoT Gas Management"
    description: "IoT CO\u2082 management platform for facility managers. Smart sensors on gas bottles measure fill levels in real-time, feed data to a cloud dashboard, and trigger automated reordering via supplier networks. Led design system setup and UI refinement during early incubation at Camsol."
    role: "Product Design Lead (Camsol Incubation)"
    tech:
      - IoT Sensors
      - Cloud Dashboard
      - Mobile App
      - Supplier API Integration
    url: https://gasvisor.eu

  - name: "CheckMe — Digital Health Platform"
    description: "Digital health platform for breast cancer detection across African communities. Combines AI-powered self-check guides, a 24/7 health companion (Nia), provider network, and the CheckMate screening device for clinics. Consulted on platform architecture — structuring doctor-patient workflows and dashboard design."
    role: "Strategic Consultant (Camsol Incubation)"
    tech:
      - Mobile App
      - AI Health Companion
      - Telemedicine
      - Provider Network
    url: https://checkme-app.com

