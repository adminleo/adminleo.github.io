portfolio:
  headline: "Product · Innovation · AI"
  subheadline: "CEO & Co-Founder at Creativate AI Studio | AI Decision Intelligence | Product & Innovation | Open to part-time leadership & advisory roles"
  about: >
    Founder building AI decision software and collaborating with companies on product
    and innovation projects. As CEO & Co-Founder of Creativate AI Studio, I'm developing
    cNode — a platform that helps teams structure complex decisions, compare scenarios,
    and generate explainable AI-assisted recommendations. Alongside the product, we
    launched AI Playbook, a multilingual knowledge base covering the EU AI Act, GDPR,
    and responsible AI adoption.

    Over the past decade I've built and operated multiple ventures across product design,
    business development, and software. My work usually sits at the intersection of product
    strategy, AI, and early-stage execution — turning ideas into working systems and
    prototypes.

    In addition to running Creativate, I collaborate with companies on part-time or project
    engagements around product strategy, AI product development, MVP architecture, and
    early-stage venture building. I enjoy working with small teams that move quickly and
    build meaningful products.
  services:
    - title: "Product & Innovation"
      icon: "\U0001F3AF"
      description: "From zero-to-one product builds to scaling existing platforms. User research, roadmapping, prototyping, and hands-on execution — across B2B SaaS, deep tech, and digital products."
    - title: "AI Decision Intelligence"
      icon: "\U0001F916"
      description: "Building explainable AI systems at Creativate. EU AI Act compliance, responsible AI adoption, and turning complex AI capabilities into practical tools teams actually use."
    - title: "Business Development & Venture Building"
      icon: "\U0001F4C8"
      description: "Partnerships, go-to-market strategy, and operational setup for early-stage ventures. Experience across startups, accelerators, and corporate innovation — connecting dots between teams, investors, and markets."
  linkedin_posts:
    - author: "EU\u2013INC"
      author_image: "eu_inc.jpg"
      excerpt: "President von der Leyen just unveiled EU-INC at Davos — a unified legal framework for European entrepreneurs. Online company registration in 48 hours, streamlined cross-border operations. A single legal entity for all European founders. This is what building for Europe looks like."
      date: "Jan 2026"
      url: "https://www.linkedin.com/feed/update/urn:li:activity:7419617084063502336/"
      likes: "12.6k"
      comments: "596"
    - author: "Leonardo Bornhaeusser"
      author_image: ""
      excerpt: "Germany spends ~129 billion euros annually on R&D — yet early-stage entrepreneurial activity remains roughly half the level of the US. Only 27 of 702 funded German startups in 2024 had all-female founding teams. We built Creativate AI Studio as a female-led, deep-tech initiative. Diverse teams aren't optional — they're how you maximize innovation potential."
      date: "Nov 2025"
      url: "https://www.linkedin.com/posts/leonardo-bornh%C3%A4u%C3%9Fer_germany-spends-billions-on-ideas-that-never-activity-7395019693574619136-vCPk"
      likes: "62"
      comments: "8"
    - author: "Jan Seidemann"
      author_image: ""
      excerpt: "Futury just launched their first female founder program — 'Scale, Grow & Connect for Women-Led Ventures' with 13 startups including Creativate AIStudio. Leadership development, corporate partnerships, and strategic networking in the Rhine-Main region. Super valuable knowledge-sharing and a safe space for open exchange."
      date: "Nov 2025"
      url: "https://www.linkedin.com/posts/janseidemann_das-erste-female-founder-programm-von-activity-7394287918678241280-cYc5"
      likes: "119"
      comments: "16"
    - author: "Landkreis Mittelsachsen"
      author_image: "landkreis_mittelsachsen.jpg"
      excerpt: "Speaking at the 9th Wirtschaftsfrauen networking event in Mittelsachsen on 'Investing Reimagined: Business Angels, Women Power, and Tokenization.' How women can translate capital, knowledge, and values into real impact — alongside Christoph Jentzsch from Tokenize.it on democratizing investments."
      date: "Oct 2025"
      url: "https://www.linkedin.com/posts/landkreis-mittelsachsen_mut-kapital-wirkung-frauen-gestalten-ugcPost-7389619833786494976-hsDP"
