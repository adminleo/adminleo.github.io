projects:
  - name: cNode — Decision Workspace
    description: AI-augmented decision platform where teams define decisions, set weighted goals, state assumptions, create and compare scenarios, get LLM-powered recommendations, and export audit-ready decision logs. Full-stack SaaS with multi-provider AI abstraction, scoring engine, Monte Carlo analysis, and multi-tenant RBAC.
    tech:
      - Next.js 14
      - FastAPI
      - PostgreSQL / TimescaleDB
      - Celery / Redis
      - Multi-Provider AI (Anthropic, OpenAI, Google)
      - Docker Compose
      - JWT / RBAC
    url: https://c-node.ai

  - name: Creativate AIStudio
    description: Deep-tech venture studio and consulting company. We build AI products and help companies integrate AI responsibly — EU AI Act compliant, business-first. Runs a monorepo ecosystem with company website, content hub, IP data room, and client platforms.
    tech:
      - Next.js / TypeScript
      - Turborepo
      - Tailwind CSS
      - Docker
    url: https://creativate.tech

  - name: AI Playbook
    description: Multilingual AI compliance and regulatory knowledge base covering EU AI Act, GDPR, EDPB guidelines, and responsible AI practices. 30+ articles across 7 categories, interactive readiness assessments, full-text search, and glossary. Content-driven lead-gen tool.
