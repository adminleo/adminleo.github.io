about: |
  I started my first venture in high school and have been building ever since — sometimes
  succeeding, sometimes failing, always learning. Over the past 11 years I've co-founded
  companies, designed products, and worn every hat from sales to ops to writing code.

  My current projects (Creativate AI Studio, c-node.ai) run as focused side ventures,
  which means I have the time and energy to commit to a part-time or project-based role
  where I can be genuinely useful. I work best in small, collaborative teams where people
  care about what they're building.

  I don't have a university degree — I chose the entrepreneurial path instead. What I do
  have is practical experience across product, business development, and innovation, plus
  the humility that comes from learning most things the hard way. I'm not looking for a
  title. I'm looking for good people and meaningful work.

