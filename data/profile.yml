portfolio:
  headline: "Builder Looking for a Team"
  subheadline: "11 years of starting things, breaking things, and figuring it out — now looking to bring that experience to a team where I can contribute and keep learning."
  about: >
    I've spent the last decade building ventures — some worked, some didn't, all taught me
    something. My side projects (c-node.ai, Creativate AI Studio) keep me sharp, but what
    I'm really looking for is a team. A place where I can bring what I've learned about
    product, business development, and getting things off the ground, and combine it with
    the structure and perspective that comes from working with good people.
    I don't have all the answers, but I'm reliable, I care about the work, and I'm not
    afraid to do the unglamorous stuff that actually moves things forward.
  services:
    - title: "Product & Innovation"
      icon: "\U0001F3AF"
      description: "I've built products from scratch and learned what works (and what doesn't) through a lot of trial and error. Happy to help with user research, roadmapping, or just rolling up sleeves on whatever needs doing."
    - title: "AI Strategy & Consulting"
      icon: "\U0001F916"
      description: "Working on explainable AI and EU AI Act compliance through Creativate. I can help teams think through how to adopt AI practically — not just the shiny parts, but the messy real-world stuff too."
    - title: "Business Development & Operations"
      icon: "\U0001F4C8"
      description: "Building partnerships, sorting out processes, connecting dots between teams. I've done this across startups and a couple of corporate settings — I'm not an expert at everything, but I know how to make progress."
  linkedin_posts:
    - author: "EU\u2013INC"
      author_image: "eu_inc.jpg"
      excerpt: "President von der Leyen just unveiled EU-INC at Davos — a unified legal framework for European entrepreneurs. Online company registration in 48 hours, streamlined cross-border operations. A single legal entity for all European founders. This is what building for Europe looks like."
      date: "Jan 2026"
      url: "https://www.linkedin.com/feed/update/urn:li:activity:7419617084063502336/"
      likes: "12.6k"
      comments: "596"
    - author: "Leonardo Bornhaeusser"
      author_image: ""
      excerpt: "Germany spends ~129 billion euros annually on R&D — yet early-stage entrepreneurial activity remains roughly half the level of the US. Only 27 of 702 funded German startups in 2024 had all-female founding teams. We built Creativate AI Studio as a female-led, deep-tech initiative. Diverse teams aren't optional — they're how you maximize innovation potential."
      date: "Nov 2025"
      url: "https://www.linkedin.com/posts/leonardo-bornh%C3%A4u%C3%9Fer_germany-spends-billions-on-ideas-that-never-activity-7395019693574619136-vCPk"
      likes: "62"
      comments: "8"
    - author: "Jan Seidemann"
      author_image: ""
      excerpt: "Futury just launched their first female founder program — 'Scale, Grow & Connect for Women-Led Ventures' with 13 startups including Creativate AIStudio. Leadership development, corporate partnerships, and strategic networking in the Rhine-Main region. Super valuable knowledge-sharing and a safe space for open exchange."
      date: "Nov 2025"
      url: "https://www.linkedin.com/posts/janseidemann_das-erste-female-founder-programm-von-activity-7394287918678241280-cYc5"
      likes: "119"
      comments: "16"
    - author: "Landkreis Mittelsachsen"
      author_image: "landkreis_mittelsachsen.jpg"
      excerpt: "Speaking at the 9th Wirtschaftsfrauen networking event in Mittelsachsen on 'Investing Reimagined: Business Angels, Women Power, and Tokenization.' How women can translate capital, knowledge, and values into real impact — alongside Christoph Jentzsch from Tokenize.it on democratizing investments."
      date: "Oct 2025"
      url: "https://www.linkedin.com/posts/landkreis-mittelsachsen_mut-kapital-wirkung-frauen-gestalten-ugcPost-7389619833786494976-hsDP"
      likes: "74"
